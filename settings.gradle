pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':libs:annotation', ':libs:annotation-processor:'

rootProject.name = 'Conversations'

// Build libsignal from source (submodule at deps/libsignal, tag v0.94.1).
// This replaces the Maven org.signal:libsignal-android artifact so that
// F-Droid (and any other reproducible-build environment) can compile the
// Rust/JNI library itself instead of using Signal's prebuilt .so files.
// Requires: Rust toolchain with Android cross-compilation targets.
//   rustup target add aarch64-linux-android armv7-linux-androideabi \
//                     x86_64-linux-android i686-linux-android
includeBuild('deps/libsignal/java') {
    dependencySubstitution {
        substitute module('org.signal:libsignal-android') using project(':android')
    }
}
